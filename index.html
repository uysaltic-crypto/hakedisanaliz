<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hakediş Analiz Araçları</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper:#F4F5F3;--panel:#FFFFFF;--ink:#1C2B36;--ink-soft:#5B6B75;--line:#DCE1E2;
    --steel:#2E4B5E;--steel-deep:#1B3140;--amber:#E8A23D;--amber-deep:#C6822A;--radius:10px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',-apple-system,Segoe UI,Roboto,sans-serif;}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:2px solid var(--steel-deep);background:var(--panel);flex-wrap:wrap;position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:38px;height:38px;border-radius:8px;background:var(--steel-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:20px;height:20px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;margin:0;color:var(--steel-deep);letter-spacing:-0.01em;}
  .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .badge{font-family:monospace;font-size:10.5px;color:var(--steel);background:#E8ECE7;border:1px solid var(--line);padding:5px 10px;border-radius:20px;white-space:nowrap;}

  .columns{display:flex;gap:24px;align-items:flex-start;padding:28px 24px 40px;max-width:1900px;margin:0 auto;}
  .column{flex:1;min-width:0;}
  @media (max-width:900px){.columns{flex-direction:column;}}

  .section{}
  .section-head{display:flex;align-items:center;gap:12px;margin:0 0 16px;}
  .section-icon{width:34px;height:34px;border-radius:8px;background:var(--steel-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .section-icon svg{width:19px;height:19px;}
  .section-head h2{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;margin:0;color:var(--steel-deep);letter-spacing:-0.01em;}
  .section-head .sdesc{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  .frame-box{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,0.03);}
  iframe{width:100%;height:1500px;border:none;display:block;background:var(--paper);}

  .loading-row{font-size:12px;color:var(--ink-soft);font-family:monospace;}
</style>
</head>
<body>

  <header class="top">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E8A23D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="7" width="15" height="10" rx="1"></rect>
          <path d="M16 10h4l3 3v4h-7z"></path>
          <circle cx="6" cy="19" r="2"></circle>
          <circle cx="18" cy="19" r="2"></circle>
        </svg>
      </div>
      <div>
        <h1>Hakediş Analiz Araçları</h1>
        <div class="sub">Nakliye ve süt hakediş hesaplamaları tek sayfada.</div>
      </div>
    </div>
    <div class="badge">TARAYICIDA ÇALIŞIR · DOSYA SUNUCUYA GÖNDERİLMEZ</div>
  </header>

  <div class="columns">
    <div class="column">
      <section class="section" id="bolum-nakliye">
        <div class="section-head">
          <div class="section-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#E8A23D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="7" width="15" height="10" rx="1"></rect><path d="M16 10h4l3 3v4h-7z"></path>
              <circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="19" r="2"></circle>
            </svg>
          </div>
          <div>
            <h2>Nakliye Hakediş</h2>
            <div class="sdesc">Plaka, KM/Litre ve fiyat sütunlarına göre nakliye hakediş hesaplama ve analiz aracı.</div>
          </div>
        </div>
        <div class="frame-box">
          <iframe id="frame-nakliye" title="Nakliye Hakediş Analiz Aracı"></iframe>
        </div>
      </section>
    </div>

    <div class="column">
      <section class="section" id="bolum-sut">
        <div class="section-head">
          <div class="section-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#E8A23D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 2v4"></path><path d="M16 2v4"></path><rect x="3" y="6" width="18" height="16" rx="2"></rect><path d="M3 12h18"></path>

          <iframe id="frame-sut" title="Süt Nakliye Hakediş & KDV Analiz Aracı"></iframe>
        </div>
      </section>
    </div>
  </div>

<script>
  // ---- Paylaşılan Google Drive bağlantı modülü ----
  // Nakliye ve Süt araçları alttaki <iframe>'lerin İÇİNDE çalışır. Google'ın oturum açma
  // sistemi (GIS) iframe içinden başlatılan isteklerde origin'i güvenilir tespit edemediği
  // için ("origin=null" hatasıyla reddediyor), gerçek Google bağlantısı burada, ÜST sayfada
  // kurulur. İki iframe de window.top.DriveBackup üzerinden bu tek bağlantıyı paylaşır ve
  // kendi ayrı yedek dosyalarını (nakliye/sut) bu ortak bağlantı üzerinden okur/yazar.
  window.DriveBackup = (function(){
    const GOOGLE_CLIENT_ID = '111769327838-vfduig1rsi208c4m21tpcrrprm6ee47h.apps.googleusercontent.com';
    const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
    const CONNECTED_KEY = 'hakedis_analiz_drive_connected_v1';
    let tokenClient = null;
    let accessToken = null;
    const fileIdCache = {};
    const listeners = [];

    function notify(status){ listeners.forEach(fn => { try { fn(status); } catch(e){} }); }
    function onStatusChange(fn){ listeners.push(fn); }
    function isConnected(){ return !!accessToken; }

    function init(){
      if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){
        setTimeout(init, 300);
        return;
      }
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: (resp) => {
          if (resp.error){ notify({ error: resp.error }); return; }
          accessToken = resp.access_token;
          try { localStorage.setItem(CONNECTED_KEY, '1'); } catch(e){}
          notify({ connected: true });
        }
      });
      let wasConnected = false;
      try { wasConnected = localStorage.getItem(CONNECTED_KEY) === '1'; } catch(e){}
      if (wasConnected) tokenClient.requestAccessToken({ prompt: '' });
    }
    function connect(){
      if (!tokenClient){ notify({ error: 'not_ready' }); return; }
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }
    async function apiFetch(url, opts){
      opts = opts || {};
      opts.headers = Object.assign({}, opts.headers, { Authorization: 'Bearer ' + accessToken });
      const res = await fetch(url, opts);
      if (res.status === 401){ throw new Error('Oturum süresi doldu, lütfen tekrar bağlanın.'); }
      return res;
    }
    async function findFile(name){
      if (fileIdCache[name]) return fileIdCache[name];
      const q = encodeURIComponent(`name='${name}'`);
      const res = await apiFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name)`);
      const data = await res.json();
      const id = (data.files && data.files.length) ? data.files[0].id : null;
      if (id) fileIdCache[name] = id;
      return id;
    }
    async function createFile(name, contentObj){
      const metadata = { name, parents: ['appDataFolder'], mimeType: 'application/json' };
      const boundary = 'hakedis_analiz_boundary';
      const body = `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(contentObj)}\r\n--${boundary}--`;
      const res = await apiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method: 'POST',
        headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
        body
      });
      const data = await res.json();
      fileIdCache[name] = data.id;
      return data.id;
    }
    async function updateFile(fileId, contentObj){
      await apiFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(contentObj)
      });
    }
    async function getFileContent(fileId){
      const res = await apiFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
      return res.json();
    }
    async function sync(fileName, contentObj){
      if (!accessToken) throw new Error('Google Drive\'a bağlı değil.');
      let id = await findFile(fileName);
      if (id) await updateFile(id, contentObj);
      else id = await createFile(fileName, contentObj);
      return true;
    }
    async function restore(fileName){
      if (!accessToken) throw new Error('Google Drive\'a bağlı değil.');
      const id = await findFile(fileName);
      if (!id) return null;
      return await getFileContent(id);
    }

    window.addEventListener('load', init);
    return { connect, isConnected, sync, restore, onStatusChange };
  })();

  function b64ToUtf8(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  // srcdoc kullanılır (data: URL yerine), çünkü srcdoc içeriği üst sayfayla aynı origin sayılır
  // ve bu sayede iframe'in gerçek içerik yüksekliğini okuyup otomatik boy ayarlayabiliriz.
  function setupFrame(id, b64){
    const f = document.getElementById(id);
    f.srcdoc = b64ToUtf8(b64);
    const resize = () => {
      try {
        const doc = f.contentDocument || f.contentWindow.document;
        f.style.height = Math.max(600, doc.documentElement.scrollHeight + 20) + 'px';
      } catch(e){ /* erişim engellenirse sabit yükseklikte kalır */ }
    };
    f.addEventListener('load', () => {
      resize();
      let last = 0;
      setInterval(() => {
        try {
          const doc = f.contentDocument || f.contentWindow.document;
          const h = doc.documentElement.scrollHeight;
          if (h !== last){ last = h; resize(); }
        } catch(e){}
      }, 500);
    });
  }
  setupFrame('frame-nakliye', NAK_B64);
  setupFrame('frame-sut', SUT_B64);
</script>
